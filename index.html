<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>StokPro Max - Ribuan Barang Siap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f8;
            padding: 14px 12px 24px;
        }
        .app {
            max-width: 500px;
            margin: 0 auto;
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .logo h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e4620, #2e7d32);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            background: #e8f5e9;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.7rem;
        }
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1f3e5c;
        }
        .btn-back:hover {
            background: #eef2f8;
        }
        /* Scan Card */
        .scan-card {
            background: white;
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .btn-scan {
            background: linear-gradient(95deg, #1a3a2e, #2a5a3e);
            width: 100%;
            padding: 12px;
            border-radius: 60px;
            border: none;
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .manual-group {
            display: flex;
            gap: 8px;
            background: #f8fafd;
            border-radius: 60px;
            padding: 4px 4px 4px 16px;
            border: 1px solid #e2ecf5;
        }
        .manual-group input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            outline: none;
            font-size: 0.85rem;
        }
        .manual-group button {
            background: #eef2f7;
            border: none;
            padding: 0 18px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
        }
        #scanStatus {
            font-size: 0.7rem;
            background: #eef3fc;
            padding: 8px;
            border-radius: 40px;
            margin-top: 10px;
            text-align: center;
        }
        .qr-wrapper { margin-top: 12px; border-radius: 20px; overflow: hidden; display: none; background: #000; }
        .qr-wrapper.active { display: block; }
        #qr-reader { width: 100%; }
        /* Search & Filter */
        .search-box {
            background: white;
            border-radius: 60px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            border: 1px solid #e2ecf5;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.85rem;
        }
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 10px;
            scrollbar-width: thin;
        }
        .cat-chip {
            background: #f0f4fa;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-chip.active { background: #2e7d32; color: white; }
        /* Info ringkasan */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin: 8px 0 12px;
            font-size: 0.7rem;
            color: #5f6c84;
        }
        /* LIST STOK */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .stock-card {
            background: white;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #edf2f8;
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .product-name {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .barcode-text {
            font-size: 0.6rem;
            font-family: monospace;
            color: #7c8ea0;
            margin-top: 4px;
        }
        .category-tag {
            background: #eef2ff;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .price-stock {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .price { font-weight: 700; color: #2e7d32; font-size: 0.85rem; }
        .stock-badge {
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.7rem;
        }
        .action-group {
            display: flex;
            gap: 6px;
        }
        .action-group button {
            background: #f0f4f9;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 28px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-inc { color: #2e7d32; }
        .btn-dec { color: #c62828; }
        .btn-edit { color: #1565c0; background: #e8f0fe; width: auto; padding: 0 12px; }
        .btn-del { color: #b00020; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin: 12px 0 8px;
        }
        .page-btn {
            background: #f0f4fa;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .page-btn.active { background: #2e7d32; color: white; }
        .info-text { text-align: center; font-size: 0.65rem; color: #7c8ea0; margin-top: 8px; }
        .empty-state { text-align: center; padding: 40px; color: #8a9bb0; }
        /* Floating Button */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2e7d32;
            width: 52px;
            height: 52px;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(46,125,50,0.4);
            cursor: pointer;
            border: none;
            z-index: 100;
        }
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 340px;
            border-radius: 32px;
            padding: 22px 18px;
        }
        .modal-content h3 { text-align: center; margin-bottom: 14px; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0;
            border-radius: 60px;
            border: 1px solid #e2ecf5;
            outline: none;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 16px; }
        .modal-buttons button { flex: 1; padding: 10px; border-radius: 60px; border: none; font-weight: 600; cursor: pointer; }
        .btn-save-modal { background: #2e7d32; color: white; }
        .btn-cancel-modal { background: #eef2f7; }
    </style>
</head>
<body>
<a href="index.html" class="btn-back">
    <i class="fas fa-arrow-left"></i>
</a>
<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="logo"><h1><i class="fas fa-warehouse"></i> StokPro</h1></div>
        <div class="badge" id="totalCount">0 item</div>
    </div>

    <!-- Scan Barcode -->
    <div class="scan-card">
        <button class="btn-scan" id="openCameraBtn"><i class="fas fa-camera"></i> Scan Barcode</button>
        <div class="manual-group">
            <input type="text" id="manualBarcode" placeholder="Ketik barcode / SKU">
            <button id="manualSearchBtn"><i class="fas fa-search"></i> Cari</button>
        </div>
        <div id="scanStatus">📷 Scan barcode untuk tambah stok +1 atau edit</div>
        <div id="qrWrapper" class="qr-wrapper">
            <div id="qr-reader"></div>
            <button id="closeCamBtn" style="margin-top:8px; width:100%; padding:8px; background:#eef2f7; border:none; border-radius:40px;">Tutup</button>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari nama atau barcode... (cepat)">
    </div>
    <div class="category-scroll" id="categoryContainer">
        <button class="cat-chip active" data-cat="all">Semua</button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
        <span id="rangeInfo">-</span>
        <span id="filteredCount">-</span>
    </div>

    <!-- Daftar Stok (Mobile card) -->
    <div class="stock-list" id="stockList"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
    <div class="info-text" id="pageInfo"></div>

    <!-- FAB -->
    <button class="fab" id="fabBtn"><i class="fas fa-plus"></i></button>
</div>

<!-- Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Tambah Barang</h3>
        <input type="text" id="modalName" placeholder="Nama Barang">
        <input type="text" id="modalBarcode" placeholder="Kode Barcode">
        <select id="modalCategory"></select>
        <input type="number" id="modalPrice" placeholder="Harga">
        <input type="number" id="modalStock" placeholder="Stok">
        <div class="modal-buttons">
            <button class="btn-cancel-modal" id="modalCancel">Batal</button>
            <button class="btn-save-modal" id="modalSave">Simpan</button>
        </div>
    </div>
</div>

<script>
    // ============= DATA STOK (SUPPORT RIBAUAN ITEM) =============
    let stockItems = [];
    let nextId = 1;

    // Load / Seed Data - GENERATE 1500 ITEM UNTUK DEMO KEKUATAN
    function loadData() {
        const saved = localStorage.getItem('stokpro_data');
        if (saved) {
            try {
                stockItems = JSON.parse(saved);
                if (stockItems.length > 0) {
                    nextId = Math.max(...stockItems.map(i => i.id), 0) + 1;
                    return;
                }
            } catch(e) {}
        }
        // SEED 1500 ITEM (Ribuan) - CEPAT & RINGAN
        const categoriesList = ["Makanan", "Minuman", "Snack", "Perawatan", "Elektronik", "Alat Tulis", "Pakaian", "Otomotif", "Obat", "Rumah Tangga"];
        for (let i = 1; i <= 1500; i++) {
            const cat = categoriesList[i % categoriesList.length];
            stockItems.push({
                id: i,
                name: `${cat} ${Math.floor(i/50)+1} - ${["A","B","C","D"][i%4]} ${String(i).padStart(3,'0')}`,
                barcode: `89999${String(100000 + i).slice(1)}`,
                category: cat,
                price: 3000 + (i * 77) % 200000,
                stock: Math.floor(Math.random() * 500) + 1
            });
        }
        // tambah sample barcode terkenal
        stockItems.push({ id: 1501, name: "Indomie Goreng", barcode: "8998866202123", category: "Makanan", price: 3500, stock: 45 });
        stockItems.push({ id: 1502, name: "Pocari Sweat", barcode: "8992766800054", category: "Minuman", price: 8500, stock: 22 });
        nextId = 1503;
        saveData();
    }

    function saveData() { localStorage.setItem('stokpro_data', JSON.stringify(stockItems)); }
    function formatRupiah(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n); }

    // Filter & Pagination
    let currentCat = "all";
    let searchQuery = "";
    let currentPage = 1;
    const PER_PAGE = 15;

    function getFiltered() {
        let filtered = [...stockItems];
        if (currentCat !== "all") filtered = filtered.filter(i => i.category === currentCat);
        if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(i => i.name.toLowerCase().includes(q) || i.barcode.includes(q));
        }
        return filtered;
    }

    function renderList() {
        const filtered = getFiltered();
        const total = filtered.length;
        const totalPages = Math.ceil(total / PER_PAGE);
        if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        const start = (currentPage-1) * PER_PAGE;
        const pageItems = filtered.slice(start, start + PER_PAGE);

        const container = document.getElementById('stockList');
        if (pageItems.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-box-open"></i><p>Tidak ada barang ditemukan</p></div>`;
        } else {
            let html = '';
            for (let item of pageItems) {
                html += `
                    <div class="stock-card" data-id="${item.id}">
                        <div class="card-row">
                            <div><div class="product-name">${escapeHtml(item.name)}</div>
                            <div class="barcode-text"><i class="fas fa-barcode"></i> ${item.barcode}</div></div>
                            <div class="category-tag">${escapeHtml(item.category)}</div>
                        </div>
                        <div class="detail-row">
                            <div class="price-stock">
                                <span class="price">${formatRupiah(item.price)}</span>
                                <span class="stock-badge"><i class="fas fa-cubes"></i> ${item.stock}</span>
                            </div>
                            <div class="action-group">
                                <button class="btn-inc" data-id="${item.id}"><i class="fas fa-plus"></i></button>
                                <button class="btn-dec" data-id="${item.id}"><i class="fas fa-minus"></i></button>
                                <button class="btn-edit" data-id="${item.id}"><i class="fas fa-pen"></i> Edit</button>
                                <button class="btn-del" data-id="${item.id}"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            attachEvents();
        }

        document.getElementById('totalCount').innerHTML = `${total} item`;
        document.getElementById('rangeInfo').innerHTML = `📦 ${start+1} - ${Math.min(start+PER_PAGE, total)}`;
        document.getElementById('filteredCount').innerHTML = `dari ${total}`;
        renderPagination(totalPages);
    }

    function attachEvents() {
        document.querySelectorAll('.btn-inc').forEach(btn => btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); updateStock(id, 1); }));
        document.querySelectorAll('.btn-dec').forEach(btn => btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); updateStock(id, -1); }));
        document.querySelectorAll('.btn-edit').forEach(btn => btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); openEditModal(id); }));
        document.querySelectorAll('.btn-del').forEach(btn => btn.addEventListener('click', (e) => { if(confirm('Hapus barang?')) deleteItem(parseInt(btn.dataset.id)); }));
    }

    function updateStock(id, delta) {
        const idx = stockItems.findIndex(i => i.id === id);
        if (idx !== -1) {
            let newStock = stockItems[idx].stock + delta;
            if (newStock < 0) newStock = 0;
            stockItems[idx].stock = newStock;
            saveData();
            renderList();
            showMessage(`Stok ${stockItems[idx].name} → ${newStock}`, "#dcfce7");
        }
    }

    function deleteItem(id) {
        stockItems = stockItems.filter(i => i.id !== id);
        saveData();
        if (currentPage > 1 && getFiltered().length <= (currentPage-1)*PER_PAGE) currentPage--;
        renderList();
        updateCategoryFilter();
    }

    function renderPagination(totalPages) {
        const container = document.getElementById('pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let btns = '';
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);
        for (let i = startPage; i <= endPage; i++) {
            btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        container.innerHTML = btns;
        document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', (e) => { currentPage = parseInt(btn.dataset.page); renderList(); }));
    }

    function updateCategoryFilter() {
        const cats = [...new Set(stockItems.map(i => i.category))].sort();
        const container = document.getElementById('categoryContainer');
        let html = `<button class="cat-chip ${currentCat === 'all' ? 'active' : ''}" data-cat="all">Semua</button>`;
        cats.forEach(c => { html += `<button class="cat-chip ${currentCat === c ? 'active' : ''}" data-cat="${c}">${c}</button>`; });
        container.innerHTML = html;
        document.querySelectorAll('.cat-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCat = btn.dataset.cat;
                currentPage = 1;
                document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderList();
            });
        });
    }

    let editId = null;
    function openAddModal() { editId = null; document.getElementById('modalTitle').innerText = "Tambah Barang"; clearModalFields(); document.getElementById('productModal').classList.add('active'); }
    function openEditModal(id) {
        const prod = stockItems.find(i => i.id === id);
        if (prod) {
            editId = id;
            document.getElementById('modalTitle').innerText = "Edit Barang";
            document.getElementById('modalName').value = prod.name;
            document.getElementById('modalBarcode').value = prod.barcode;
            document.getElementById('modalPrice').value = prod.price;
            document.getElementById('modalStock').value = prod.stock;
            populateCategorySelect(prod.category);
            document.getElementById('productModal').classList.add('active');
        }
    }
    function populateCategorySelect(selectedVal) {
        const cats = [...new Set(stockItems.map(i => i.category))];
        const select = document.getElementById('modalCategory');
        select.innerHTML = cats.map(c => `<option value="${c}" ${c === selectedVal ? 'selected' : ''}>${c}</option>`).join('');
    }
    function clearModalFields() {
        document.getElementById('modalName').value = '';
        document.getElementById('modalBarcode').value = '';
        document.getElementById('modalPrice').value = '';
        document.getElementById('modalStock').value = '';
        populateCategorySelect('');
    }
    function saveProduct() {
        const name = document.getElementById('modalName').value.trim();
        const barcode = document.getElementById('modalBarcode').value.trim();
        const category = document.getElementById('modalCategory').value;
        const price = parseInt(document.getElementById('modalPrice').value);
        const stock = parseInt(document.getElementById('modalStock').value);
        if (!name || !barcode || isNaN(price)) { alert("Isi lengkap!"); return; }
        if (editId === null) {
            if (stockItems.some(i => i.barcode === barcode)) { alert("Barcode sudah ada!"); return; }
            stockItems.push({ id: nextId++, name, barcode, category, price, stock: isNaN(stock)?0:stock });
        } else {
            const idx = stockItems.findIndex(i => i.id === editId);
            if (idx !== -1) {
                if (stockItems.some(i => i.barcode === barcode && i.id !== editId)) { alert("Barcode sudah terdaftar!"); return; }
                stockItems[idx] = { ...stockItems[idx], name, barcode, category, price, stock: isNaN(stock)?0:stock };
            }
        }
        saveData();
        updateCategoryFilter();
        renderList();
        closeModal();
        showMessage("Data tersimpan", "#dcfce7");
    }
    function closeModal() { document.getElementById('productModal').classList.remove('active'); editId = null; }

    let scanner = null, camActive = false;
    const qrWrap = document.getElementById('qrWrapper');
    const scanSpan = document.getElementById('scanStatus');
    async function startCam() {
        if (camActive) { stopCam(); return; }
        qrWrap.classList.add('active');
        scanner = new Html5Qrcode("qr-reader");
        try {
            await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, (decoded) => { handleBarcode(decoded); }, (err)=>{});
            camActive = true;
            scanSpan.innerHTML = "📷 Kamera aktif. Scan barcode produk";
        } catch(e) { scanSpan.innerHTML = "Gagal akses kamera"; qrWrap.classList.remove('active'); }
    }
    function stopCam() {
        if (scanner && camActive) { scanner.stop().then(()=>{ camActive=false; qrWrap.classList.remove('active'); scanSpan.innerHTML="📷 Siap scan barcode"; }).catch(()=>{}); }
        else { qrWrap.classList.remove('active'); camActive=false; }
    }
    function handleBarcode(barcode) {
        const product = stockItems.find(p => p.barcode === barcode.trim());
        if (!product) { showMessage(`❌ Barcode tidak ditemukan`, "#ffe6e5", 1500); return; }
        const ok = confirm(`${product.name}\nStok: ${product.stock}\n\nOK → +1 stok\nBatal → Edit`);
        if (ok) updateStock(product.id, 1);
        else openEditModal(product.id);
    }
    function manualSearch() {
        const code = document.getElementById('manualBarcode').value.trim();
        if (!code) { showMessage("Masukkan barcode", "#fff0d8"); return; }
        handleBarcode(code);
        document.getElementById('manualBarcode').value = '';
    }
    function showMessage(msg, bg, dur=1500) {
        scanSpan.style.backgroundColor = bg;
        scanSpan.innerHTML = msg;
        setTimeout(() => { if(!camActive) scanSpan.innerHTML = "📷 Scan barcode untuk tambah stok +1 atau edit"; else scanSpan.innerHTML = "📷 Kamera aktif"; }, dur);
    }

    let searchTimeout;
    function bindEvents() {
        document.getElementById('openCameraBtn').addEventListener('click', startCam);
        document.getElementById('closeCamBtn').addEventListener('click', stopCam);
        document.getElementById('manualSearchBtn').addEventListener('click', manualSearch);
        document.getElementById('fabBtn').addEventListener('click', openAddModal);
        document.getElementById('modalSave').addEventListener('click', saveProduct);
        document.getElementById('modalCancel').addEventListener('click', closeModal);
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = e.target.value;
                currentPage = 1;
                renderList();
            }, 300);
        });
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    function init() {
        loadData();
        updateCategoryFilter();
        bindEvents();
        renderList();
    }
    init();
</script>
</body>
</html>
